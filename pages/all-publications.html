<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Publications - Your Name</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Top Navigation - Shared Banner -->
    <nav class="top-nav">
        <ul class="nav-links">
            <li><a href="../index.html">Home</a></li>
            <li><a href="#" class="active">All Publications</a></li>
        </ul>
    </nav>

    <!-- Content Container -->
    <div class="content-container">
        <!-- Main Content -->
        <div class="main-wrapper">
            <main class="main-content">
                <section id="all-publications" class="section">
                    <h2 class="section-title">📄 All Publications <span class="subtitle-text" id="filter-indicator"></span></h2>

                    <div class="publication-filters" style="margin-top: 0; padding-top: 0; border-top: none;">
                        <a href="#" class="filter-link active" id="filter-all" data-filter="all">Full List</a>
                        <a href="#" class="filter-link" id="filter-llm" data-filter="llm">LLM</a>
                        <a href="#" class="filter-link" id="filter-physics" data-filter="physics">Physics</a>
                    </div>

                    <div class="content-block" style="margin-top: 30px;">
                        <div id="all-publications-container" class="publications-list"></div>
                        <div class="view-all-container">
                            <a href="../index.html" class="view-all-btn"><i class="fas fa-arrow-left"></i> Back to Homepage</a>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> Your Name. All rights reserved.</p>
    </footer>

    <script src="../script.js"></script>
</body>
</html>
